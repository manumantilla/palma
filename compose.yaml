services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: postgis/postgis:15-3.4
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    python.analytics:
        build:
            context: .
            dockerfile: docker/python/Dockerfile
        container_name: agro_python_analytics
        restart: unless-stopped
        ports:
            - '${FORWARD_PYTHON_PORT:-8000}:8000'
        volumes:
            - './python_service:/var/www/python_service'
        environment:
            - ENVIRONMENT=development
            - DEBUG=true
            - DB_HOST=pgsql
            - DB_PORT=5432
            - DB_NAME=${DB_DATABASE:-laravel}
            - DB_USERNAME=${DB_USERNAME:-sail}
            - DB_PASSWORD=${DB_PASSWORD:-password}
        networks:
            - sail
        depends_on:
            pgsql:
                condition:  service_healthy
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
